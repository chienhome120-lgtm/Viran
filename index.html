<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>台幣・越南盾換算</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#18324b;background:#fff}body{min-height:100svh}.card{width:100%;min-height:100vh;min-height:100svh;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:clamp(12px,2.2dvh,24px)}h1{font-size:clamp(23px,6vw,32px);text-align:center;margin:0;font-weight:800;line-height:1.25;flex:0 0 auto}.rates{background:#eaf5ff;border-radius:16px;padding:clamp(14px,2.6dvh,25px);line-height:1.85;font-size:clamp(14px,3.7vw,18px);flex:0 0 auto}.row{flex:1 1 0;min-height:112px;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2dvh,20px)}label{display:block;font-weight:800;font-size:clamp(20px,5vw,28px)}input{display:block;width:100%;min-height:clamp(74px,12dvh,130px);padding:14px 18px;border:2px solid #dce6ef;border-radius:16px;font-size:clamp(30px,8vw,46px);font-weight:700;color:#0f2740;background:#fff;appearance:none;-webkit-appearance:none}input:focus{outline:none;border-color:#1781d5}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.btn{flex:0 0 auto;width:100%;min-height:clamp(60px,9dvh,90px);border:0;border-radius:16px;background:#1673c8;color:white;font-size:clamp(20px,5vw,26px);font-weight:800;cursor:pointer}.footer{flex:0 0 auto;text-align:center;font-size:clamp(11px,2.8vw,14px);color:#64748b;line-height:1.4}@media(max-height:640px){.card{gap:8px}.rates{padding:9px 13px;font-size:13px;line-height:1.5}.row{min-height:78px;gap:6px}input{min-height:55px;font-size:28px}.btn{min-height:48px}.footer{font-size:10px}h1{font-size:22px}}
</style></head><body><main class="card"><h1>🇹🇼 台幣 ⇄ 🇻🇳 越南盾</h1><div class="rates"><b>自訂匯率</b><div>台幣 → 越南盾：1 TWD = 770 VND</div><div>越南盾 → 台幣：10,000 VND = 13 TWD</div></div><div class="row"><label for="twd">🇹🇼 新台幣 TWD</label><input id="twd" type="number" inputmode="decimal" min="0" placeholder="輸入台幣金額"></div><div class="row"><label for="vnd">🇻🇳 越南盾 VND</label><input id="vnd" type="number" inputmode="decimal" min="0" placeholder="輸入越南盾金額"></div><button class="btn" id="clear">清除金額</button><div class="footer">採用指定的雙向匯率，不連線、不自動更新</div></main><script>const twd=document.getElementById('twd'),vnd=document.getElementById('vnd');const fmt=(n,d)=>Number(n.toFixed(d)).toString();twd.addEventListener('input',()=>{vnd.value=twd.value===''?'':fmt(Math.max(0,Number(twd.value))*770,2)});vnd.addEventListener('input',()=>{twd.value=vnd.value===''?'':fmt(Math.max(0,Number(vnd.value))*13/10000,2)});document.getElementById('clear').onclick=()=>{twd.value='';vnd.value='';twd.focus()};</script></body></html>
