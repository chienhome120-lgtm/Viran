<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>台幣・越南盾換算</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#fff;color:#18324b}
body{overflow-x:hidden}
.card{width:100%;min-height:100dvh;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;align-items:stretch;gap:clamp(12px,2dvh,20px)}
h1{margin:4px 0 0;text-align:center;font-size:clamp(23px,6vw,32px);font-weight:800;line-height:1.25}
.rates{background:#eaf5ff;border-radius:14px;padding:12px 15px;line-height:1.65;font-size:clamp(13px,3.4vw,17px)}
.fields{display:flex;flex-direction:column;gap:clamp(14px,2.8dvh,26px);margin-top:clamp(4px,1.5dvh,14px)}
.row{display:flex;flex-direction:column;gap:9px}
label{display:block;font-weight:800;font-size:clamp(20px,5vw,27px)}
input{display:block;width:100%;height:clamp(78px,11dvh,108px);padding:12px 17px;border:2.5px solid;border-radius:14px;font-size:clamp(32px,8vw,44px);font-weight:750;background:#fff;appearance:none;-webkit-appearance:none}
input:focus{outline:3px solid transparent;outline-offset:2px}
.twd label,.twd input{color:#103b7a}.twd input{border-color:#103b7a}.twd input:focus{outline-color:#b6c9eb;background:#f6f9ff}
.vnd label,.vnd input{color:#921e2c}.vnd input{border-color:#921e2c}.vnd input:focus{outline-color:#f1c0c6;background:#fff8f8}
input::placeholder{color:#8c98a6;font-size:clamp(19px,5vw,25px);font-weight:400}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.btn{width:100%;min-height:62px;margin-top:clamp(4px,1dvh,12px);border:0;border-radius:14px;background:#1673c8;color:#fff;font-size:23px;font-weight:800;cursor:pointer}
.footer{text-align:center;font-size:12px;color:#64748b;line-height:1.5}
/* 鍵盤彈出時保留兩個欄位在上方，不以 flex:1 拉開距離 */
@media(max-height:650px){.card{gap:9px;padding-top:8px}.rates{padding:8px 12px;font-size:12px;line-height:1.45}.fields{gap:10px;margin-top:0}.row{gap:5px}label{font-size:18px}input{height:62px;font-size:30px}.btn{min-height:48px;margin-top:0;font-size:19px}.footer{font-size:10px}h1{font-size:21px}}
</style>
</head>
<body>
<main class="card">
<h1>🇹🇼 台幣 ⇄ 🇻🇳 越南盾</h1>
<div class="rates"><b>自訂匯率</b><div>台幣 → 越南盾：1 TWD = 770 VND</div><div>越南盾 → 台幣：10,000 VND = 13 TWD</div></div>
<div class="fields">
<div class="row twd"><label for="twd">🇹🇼 新台幣 TWD</label><input id="twd" type="number" inputmode="decimal" min="0" placeholder="輸入台幣金額" autocomplete="off"></div>
<div class="row vnd"><label for="vnd">🇻🇳 越南盾 VND</label><input id="vnd" type="number" inputmode="decimal" min="0" placeholder="輸入越南盾金額" autocomplete="off"></div>
</div>
<button class="btn" id="clear" type="button">清除金額</button>
<div class="footer">採用指定的雙向匯率，不連線、不自動更新</div>
</main>
<script>
const twd=document.getElementById('twd'),vnd=document.getElementById('vnd');
const fmt=(n,d)=>Number(n.toFixed(d)).toString();
twd.addEventListener('input',()=>{vnd.value=twd.value===''?'':fmt(Math.max(0,Number(twd.value))*770,2)});
vnd.addEventListener('input',()=>{twd.value=vnd.value===''?'':fmt(Math.max(0,Number(vnd.value))*13/10000,2)});
document.getElementById('clear').addEventListener('click',()=>{twd.value='';vnd.value='';twd.focus()});
// 手機鍵盤彈出後，將正在輸入的欄位維持在可見範圍。
for(const field of [twd,vnd]){
 field.addEventListener('focus',()=>{setTimeout(()=>field.scrollIntoView({block:'nearest',behavior:'smooth'}),220)});
}
if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{const active=document.activeElement;if(active===twd||active===vnd){active.scrollIntoView({block:'nearest',behavior:'instant'})}})}
</script>
</body>
</html>
