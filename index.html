<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>台幣・越南盾換算</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;font-family:system-ui,'Noto Sans TC',sans-serif;color:#18324b;min-height:100vh;min-height:100dvh;padding:0}.card{width:100%;max-width:none;min-height:100vh;min-height:100dvh;background:white;border-radius:0;padding:calc(28px + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));box-shadow:none;display:flex;flex-direction:column;justify-content:center}h1{font-size:25px;margin:0 0 8px}.sub{color:#64748b;font-size:14px;margin-bottom:22px}.row{margin:18px 0}label{display:block;font-weight:700;margin-bottom:9px}input{width:100%;padding:15px;border:2px solid #dce6ef;border-radius:12px;font-size:24px;color:#0f2740}input:focus{outline:none;border-color:#1781d5}.hint{font-size:13px;color:#64748b;margin-top:7px}.rates{background:#eaf5ff;border-radius:14px;padding:14px;line-height:1.9;font-size:14px}.btn{width:100%;border:0;border-radius:12px;background:#1673c8;color:white;padding:14px;font-size:16px;font-weight:bold;margin-top:18px;cursor:pointer}.footer{text-align:center;font-size:12px;color:#64748b;margin-top:18px}</style></head><body><main class="card"><h1>🇹🇼 台幣 ⇄ 🇻🇳 越南盾</h1><div class="rates"><b>自訂匯率</b><br>台幣 → 越南盾：1 TWD = 770 VND<br>越南盾 → 台幣：10,000 VND = 13 TWD</div><div class="row"><label for="twd">🇹🇼 新台幣 TWD</label><input id="twd" type="number" inputmode="decimal" min="0" placeholder="輸入台幣金額"></div><div class="row"><label for="vnd">🇻🇳 越南盾 VND</label><input id="vnd" type="number" inputmode="decimal" min="0" placeholder="輸入越南盾金額"></div><button class="btn" id="clear">清除金額</button><div class="footer">採用指定的雙向匯率，不連線、不自動更新</div></main><script>const twd=document.getElementById('twd'),vnd=document.getElementById('vnd');const fmt=(n,d)=>Number(n.toFixed(d)).toString();twd.addEventListener('input',()=>{vnd.value=twd.value===''?'':fmt(Math.max(0,Number(twd.value))*770,2);});vnd.addEventListener('input',()=>{twd.value=vnd.value===''?'':fmt(Math.max(0,Number(vnd.value))*13/10000,2);});document.getElementById('clear').onclick=()=>{twd.value='';vnd.value='';twd.focus()};</script></body></html>
